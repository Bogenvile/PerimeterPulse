version: "3.9"

# ============================================================
# PerimeterPulse — Self-Hosted Deployment (MySQL + InfluxDB)
#
# Setup:
#   1. cp .env.example .env (edit if needed)
#   2. docker compose up -d
#   3. Init MySQL schema:
#      docker compose exec -T mysql mysql -u perimeterpulse -pperimeterpulse perimeterpulse < server/db/schema.mysql.sql
#   4. Seed default users (password hashes):
#      docker compose exec mysql mysql -u perimeterpulse -pperimeterpulse perimeterpulse -e "
#        UPDATE users SET password_hash='\$2a\$10\$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy' WHERE username='admin';
#        UPDATE users SET password_hash='\$2a\$10\$RkL9J8f2Qm5Ht0XZJNmwXe5Gq.KdL9p2WzC1jV9bH3sU6yA4fT8oO' WHERE username='viewer';
#      "
#   5. Create API key:
#      Use the dashboard (admin login) → API Keys section or run:
#      docker compose exec backend node -e "
#        const bcrypt = require('bcryptjs');
#        const mysql = require('mysql2/promise');
#        (async()=>{
#          const c=await mysql.createConnection({host:'mysql',user:'perimeterpulse',password:'perimeterpulse',database:'perimeterpulse'});
#          const raw='ppulse-sk-a1b2c3d4e5f6g7h8';
#          await c.execute('INSERT INTO api_keys(key_prefix,key_hash,label) VALUES(?,?,?)',['ppulse-s',bcrypt.hashSync(raw,10),'Default']);
#          console.log('API Key:',raw);
#          await c.end();
#        })();
#      "
# ============================================================

services:
  mysql:
    image: mysql:8.4
    container_name: perimeterpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-perimeterpulse}
      MYSQL_USER: ${MYSQL_USER:-perimeterpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-perimeterpulse}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./server/db/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "perimeterpulse", "-pperimeterpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulse-net

  influxdb:
    image: influxdb:2.7-alpine
    container_name: perimeterpulse-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-perimeterpulse}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-perimeterpulse}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-perimeterpulse}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-perimeterpulse-token}
    ports:
      - "8086:8086"
    volumes:
      - influxdata:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulse-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perimeterpulse-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-perimeterpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-perimeterpulse}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-perimeterpulse}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUX_TOKEN:-perimeterpulse-token}
      INFLUXDB_ORG: ${INFLUX_ORG:-perimeterpulse}
      INFLUXDB_BUCKET: ${INFLUX_BUCKET:-perimeterpulse}
      NITRO_PORT: "3000"
      NITRO_JWT_SECRET: ${NITRO_JWT_SECRET:-perimeterpulse-jwt-secret-change-in-production}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - pulse-net

volumes:
  mysqldata:
  influxdata:

networks:
  pulse-net:
    driver: bridge
