version: '3.8'

services:
  # ── DATABASE: MYSQL ──────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: perimeterpulse-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/schema.mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BACKEND & DASHBOARD: NITRO SERVER ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perimeterpulse-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - NITRO_JWT_SECRET=${NITRO_JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: